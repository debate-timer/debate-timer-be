name: dev-cd-debug

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/#251-port-mapping"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setting dev-secret.yml
        run: |
          echo "${{ secrets.DEV_SECRET_TEMP_YML }}" > ./src/main/resources/dev-secret.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean And Test With Gradle
        run: ./gradlew clean test

      - name: bootJar with Gradle
        run: ./gradlew bootJar --info

      - name: Change artifact file name
        run: mv build/libs/*.jar build/libs/app.jar

      - name: Upload artifact file
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: ./build/libs/app.jar
          if-no-files-found: error

      - name: Upload deploy scripts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-scripts
          path: ./scripts/dev/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: dev-temp

    steps:
      - name: Download artifact file
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: ~/app/staging

      - name: Download deploy scripts
        uses: actions/download-artifact@v4
        with:
          name: deploy-scripts
          path: ~/app/scripts/

      - name: Setup log directory
        run: |
          sudo mkdir -p /home/ubuntu/logs
          sudo chown -R ubuntu:ubuntu /home/ubuntu/logs
          chmod 755 /home/ubuntu/logs

      - name: Make deploy script executable
        run: chmod +x ~/app/scripts/zero-downtime-deploy-debug.sh

      - name: Zero Downtime Deployment (Debug)
        run: sh ~/app/scripts/zero-downtime-deploy-debug.sh

      - name: Print deploy log
        if: always()
        run: |
          echo "===== DEPLOY LOG ====="
          cat /home/ubuntu/app/deploy.log || echo "No deploy log found"
          echo "===== END DEPLOY LOG ====="

      - name: Send Discord Alert on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\":x: [DEV-DEBUG] 배포 실패! 확인이 필요합니다.\n링크: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
               ${{ secrets.DISCORD_WEB_HOOK }}
