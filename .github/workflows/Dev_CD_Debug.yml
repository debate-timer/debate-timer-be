name: dev-cd-debug

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/#249-deploy-error"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setting dev-secret.yml
        run: |
          echo "${{ secrets.DEV_SECRET_YML }}" > ./src/main/resources/dev-secret.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean And Test With Gradle
        run: ./gradlew clean test

      - name: bootJar with Gradle
        run: ./gradlew bootJar --info

      - name: Change artifact file name
        run: mv build/libs/*.jar build/libs/app.jar

      - name: Upload artifact file
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: ./build/libs/app.jar
          if-no-files-found: error

      - name: Upload deploy scripts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-scripts
          path: ./scripts/dev/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: dev-temp

    steps:
      - name: Download artifact file
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: ~/app/staging

      - name: Download deploy scripts
        uses: actions/download-artifact@v4
        with:
          name: deploy-scripts
          path: ~/app/scripts/

      - name: Setup log directory
        run: |
          sudo mkdir -p /home/ubuntu/logs
          sudo chown -R ubuntu:ubuntu /home/ubuntu/logs
          chmod 755 /home/ubuntu/logs

      - name: Make deploy script executable
        run: chmod +x ~/app/scripts/zero-downtime-deploy-debug.sh

      - name: Zero Downtime Deployment (Debug)
        env:
          FORCE_STOP_OLD_FIRST: "true"
        run: sh ~/app/scripts/zero-downtime-deploy-debug.sh

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p ~/app/diagnostics
          cp ~/app/app-*.log ~/app/diagnostics/ 2>/dev/null || true
          cp ~/app/deploy.log ~/app/diagnostics/ 2>/dev/null || true
          sudo dmesg | tail -100 > ~/app/diagnostics/dmesg.log 2>/dev/null || true
          free -m > ~/app/diagnostics/memory.log 2>/dev/null || true
          ps aux --sort=-%mem | head -20 > ~/app/diagnostics/top-processes.log 2>/dev/null || true
          find /home/ubuntu -name 'hs_err_pid*.log' -exec cp {} ~/app/diagnostics/ \; 2>/dev/null || true
          find /home/ubuntu/app -name 'heapdump-*.hprof' -exec ls -lh {} \; > ~/app/diagnostics/heapdump-info.log 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics
          path: ~/app/diagnostics/
          if-no-files-found: warn

