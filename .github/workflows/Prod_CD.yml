name: prod-cd

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Develop Branch
        uses: actions/checkout@v4

      - name: Setting prod-secret.yml
        run: |
          echo "${{ secrets.PROD_SECRET_YML }}" > ./src/main/resources/prod-secret.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean And Test With Gradle
        run: ./gradlew clean test

      - name: bootJar with Gradle
        run: ./gradlew bootJar --info

      - name: Change artifact file name
        run: mv build/libs/*.jar build/libs/app.jar

      - name: Upload artifact file
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: ./build/libs/app.jar
          if-no-files-found: error

      - name: Upload deploy scripts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-scripts
          path: ./scripts/prod/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: prod

    steps:
      - name: Download artifact file
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: ~/app

      - name: Download deploy scripts
        uses: actions/download-artifact@v4
        with:
          name: deploy-scripts
          path: ~/app/scripts/

      - name: Make deploy script executable
        run: chmod +x ~/app/scripts/zero-downtime-deploy.sh

      - name: Zero Downtime Deployment
        run: sh ~/app/scripts/zero-downtime-deploy.sh

      - name: Send Discord Alert on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\":warning: :warning: [PROD] 배포 실패! :warning: :warning: \n링크: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
               ${{ secrets.DISCORD_WEB_HOOK }}
