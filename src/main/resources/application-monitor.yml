management:
  statsd:
    metrics:
      export:
        enabled: true
        flavor: datadog
        host: ${MANAGEMENT_STATSD_METRICS_EXPORT_HOST:localhost}
        port: 8125
        protocol: UDP

  server:
    port: 8083

  endpoints:
    web:
      exposure:
        include: '*'
      base-path: /monitoring

  endpoint:
    health:
      show-components: always

  info:
    java:
      enabled: true
    os:
      enabled: true

server:
  tomcat:
    mbeanregistry:
      enabled: true
