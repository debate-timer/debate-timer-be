spring:
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 60s
  servlet:
    multipart:
      # 토론 기록 Soniox 모드가 발언 구간 오디오(자유토론 등 수 분 분량)를 올린다
      max-file-size: 30MB
      max-request-size: 31MB
      # 어드민 인증 인터셉터가 본문 파싱보다 먼저 실행되도록 multipart 는 파트를 읽을 때 파싱한다
      resolve-lazily: true

server:
  shutdown: graceful

# 어드민 아이콘 업로드 위치. dev/prod는 도커 볼륨 경로로 덮어쓴다
icon:
  upload-dir: ${ICON_UPLOAD_DIR:./uploads/icon}

springdoc:
  swagger-ui:
    path: /docs/swagger
    url: /docs/openapi3.yaml
    disable-swagger-default-url: true
    filter: true
    persist-authorization: true
    display-request-duration: true
    default-model-expand-depth: 10

# 토론 분석 보고서 생성. 키가 비어 있으면 앱은 뜨고 분석만 실패로 기록한다
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5-mini}

# 토론 기록 Soniox 모드의 발언 구간 배치 전사. 키가 비어 있으면 Soniox 전사 요청만 실패한다
soniox:
  api-key: ${SONIOX_API_KEY:}
  model: ${SONIOX_MODEL:stt-async-v5}

# 토론 기록 Soniox 모드 발언 구간 오디오의 S3 보관. 꺼져 있거나 설정이 비어 있으면 저장하지 않고 전사만 한다
stt-audio:
  enabled: ${STT_AUDIO_ENABLED:false}
  bucket: ${STT_AUDIO_BUCKET:}
  region: ${STT_AUDIO_REGION:ap-northeast-2}
  access-key: ${STT_AUDIO_ACCESS_KEY:}
  secret-key: ${STT_AUDIO_SECRET_KEY:}

# 다기기 녹음 V2(청중 기기 녹음 중 턴별 최고 품질 선택 후 백그라운드 전사). 꺼져 있으면 V2 API는 404로 응답한다
recording-v2:
  enabled: ${RECORDING_V2_ENABLED:false}
