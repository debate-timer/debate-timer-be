spring:
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 60s
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /docs/swagger
    url: /docs/openapi3.yaml
    disable-swagger-default-url: true
    filter: true
    persist-authorization: true
    display-request-duration: true
    default-model-expand-depth: 10
