Configuration:
  name: Dev-Logger
  status: debug

  Properties:
    Property:
      name: log-dir
      value: "/home/ubuntu/logs"

  Appenders:
    Console:
      name: Console_Appender
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] [%thread] [%highlight{%-5level}] %logger{35} - %msg%n"

    RollingFile:
      name: RollingFile_Appender
      fileName: ${log-dir}/logfile.log
      filePattern: "${log-dir}/logfile-%d{yyyy-MM-dd}.%i.log.gz"
      JsonLayout:
        complete: false
        compact: true
        eventEol: true
        properties: true
        stacktraceAsString: true
        objectMessageAsJsonObject: true
      immediateFlush: false #false로 설정되어야 Async로 buffer에 저장됨

      Policies:
        SizeBasedTriggeringPolicy:
          size: "10 MB"
        TimeBasedTriggeringPolicy:
          Interval: 1
          modulate: true #다음 롤오버 시간을 정각 바운더리에 맞추는 설정

      DefaultRollOverStrategy:
        max: 10
        Delete:
          basePath: "${log-dir}"
          maxDepth: "1"
          IfLastModified:
            age: "P7D" #7일간 데이터는 저장됨

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: Console_Appender
        - ref: RollingFile_Appender
    Logger:
      name: debate-timer-dev
      additivity: false
      level: debug
      includeLocation: false
      AppenderRef:
        - ref: Console_Appender
        - ref: RollingFile_Appender
