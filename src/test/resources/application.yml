spring:
  profiles:
    active: test
  # 메인 설정과 같은 업로드 한도. 테스트 설정이 메인 application.yml을 대신하므로 따로 둔다
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 31MB
      # 어드민 인증 인터셉터가 본문 파싱보다 먼저 실행되도록 multipart 는 파트를 읽을 때 파싱한다
      resolve-lazily: true

cors:
  origin:
    cors-origin:
      - http://test.debate-timer.com

oauth:
  client_id: oauth_client_id
  client_secret: oauth_client_secret
  grant_type: oauth_grant_type

jwt:
  secret_key: testtesttesttesttesttesttesttest
  access_token_expiration: 1h
  refresh_token_expiration: 1d

admin:
  password: test-admin-password

icon:
  upload-dir: build/test-icon-upload

---

spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:database
    username: sa
    password:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  flyway:
    enabled: false
